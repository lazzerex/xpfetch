name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make

      - name: Build XPFetch
        run: make CC=i686-w64-mingw32-gcc

      - name: Build test binary
        run: |
          i686-w64-mingw32-gcc -Wall -Wno-unused-variable -O2 -std=c89 -D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -o test.exe test.c src/config.c src/console.c src/sys_os.c src/sys_kernel.c src/sys_cpu.c src/sys_gpu.c src/sys_mem.c src/sys_uptime.c src/sys_shell.c src/sys_disk.c src/sys_display.c src/sys_user.c

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpfetch-build
          path: |
            xpfetch.exe
            test.exe

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip xpfetch.zip xpfetch.exe xpfetch.conf
          gh release create "$GITHUB_REF_NAME" xpfetch.zip --draft --generate-notes --title "$GITHUB_REF_NAME"
